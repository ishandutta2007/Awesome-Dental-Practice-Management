<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 44px; fill: url(#text-grad); }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      
      @keyframes float1 {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(3deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      
      @keyframes float2 {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(15px) rotate(-4deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }

      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.7; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }

      .floating-bg-1 { animation: float1 8s ease-in-out infinite; transform-origin: center; }
      .floating-bg-2 { animation: float2 10s ease-in-out infinite; transform-origin: center; }
      .pulsing-glow { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)" rx="16"/>

  <!-- Background Dynamic Visuals (Layered behind text) -->
  <g class="pulsing-glow" opacity="0.4">
    <circle cx="200" cy="180" r="140" fill="#0284c7" filter="url(#glow)"/>
    <circle cx="1000" cy="120" r="160" fill="#6366f1" filter="url(#glow)"/>
  </g>

  <g class="floating-bg-1" opacity="0.25">
    <path d="M150,80 Q250,20 350,80 T550,80" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 8"/>
    <rect x="900" y="220" width="180" height="90" rx="12" fill="url(#accent)" stroke="#818cf8" stroke-width="1.5"/>
    <!-- Tooth / Medical outline subtle graphic -->
    <path d="M100,240 C100,200 130,190 140,210 C150,190 180,200 180,240 C180,270 165,290 155,300 C150,305 145,295 140,295 C135,295 130,305 125,300 C115,290 100,270 100,240 Z" fill="#38bdf8" opacity="0.3"/>
  </g>

  <g class="floating-bg-2" opacity="0.2">
    <rect x="80" y="50" width="160" height="70" rx="10" fill="url(#accent)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="1020" cy="260" r="70" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="6 6"/>
  </g>

  <!-- Foreground Content (Always Crisp & On Top) -->
  <g transform="translate(60, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 75)">
      <rect width="280" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="16" r="6" fill="#38bdf8"/>
      <text x="36" y="21" class="badge-text">CURATED DENTAL ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="160" class="title">Awesome Dental Practice Management 🦷</text>

    <!-- Subtitle -->
    <text x="0" y="205" class="subtitle">A curated list of top SaaS platforms &amp; open-source clinical software 🚀</text>

    <!-- Stat/Tag Pills -->
    <g transform="translate(0, 245)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="160" height="36" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
        <text x="16" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🏥 SaaS Platforms</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(176, 0)">
        <rect width="180" height="36" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
        <text x="16" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">💻 Open-Source Repos</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(372, 0)">
        <rect width="190" height="36" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1"/>
        <text x="16" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📋 Charting &amp; Billing</text>
      </g>
    </g>
  </g>
</svg>
